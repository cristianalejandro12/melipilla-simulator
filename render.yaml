# Servicio Node: sirve el juego y el websocket de las vacas.
# En Render, el servicio tiene que ser Web Service (no Static Site).
services:
  - type: web
    name: melipilla-simulator
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
