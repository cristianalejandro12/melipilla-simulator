<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melipilla simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd4f6; font-family: Inter, system-ui, sans-serif; color: #fff; user-select: none; }
  canvas#game { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas#game.dragging { cursor: grabbing; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at center, rgba(20,60,110,.35), rgba(10,30,60,.75)); z-index: 10; transition: opacity .6s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { margin: 0; font-size: clamp(34px, 5.6vw, 68px); font-weight: 700; letter-spacing: -0.5px; text-align: center; }
  h1 span { color: #ffe27a; }
  .bar { width: min(420px, 70vw); height: 16px; border-radius: 10px; background: rgba(255,255,255,.2); overflow: hidden; border: 2px solid rgba(255,255,255,.6); }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #ffe27a, #8fd14f); transition: width .2s; }
  #loadText { font-size: 15px; opacity: .9; }
  button#play { display: none; }
  #pick { display: none; flex-direction: column; align-items: center; gap: 14px; }
  #pick p { margin: 0; font-size: 20px; font-weight: 600; }
  #pick .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #pick button { font: inherit; font-size: 22px; font-weight: 700; padding: 14px 28px; border-radius: 40px; border: 0; cursor: pointer; color: #2b4f1a;
    background: linear-gradient(#fff6c9, #ffd95a); box-shadow: 0 6px 0 #b8891c, 0 10px 30px rgba(0,0,0,.35); }
  #pick button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8891c; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #needs { position: absolute; left: 16px; top: 14px; display: flex; gap: 12px; }
  #needs img { height: 64px; display: none; animation: pulse 0.9s ease-in-out infinite; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  #needs img.on { display: block; }
  #online { position: absolute; right: 16px; top: 14px; font-size: 14px; font-weight: 600;
    background: rgba(16, 36, 18, .5); border: 2px solid rgba(255,255,255,.5); border-radius: 999px;
    padding: 7px 14px; letter-spacing: .2px; }
  #race { position: fixed; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #race.on { display: flex; }
  #raceCount { font-size: clamp(96px, 18vw, 168px); font-weight: 700; color: #ffe27a; text-shadow: 0 8px 0 rgba(0,0,0,.35); line-height: 1; }
  #raceMsg { position: absolute; top: 16%; left: 0; right: 0; text-align: center; font-size: clamp(28px, 4vw, 46px); font-weight: 700;
    text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: .55; } }
  #soloPc { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(20,60,110,.55), rgba(8,22,44,.94)); }
  #soloPc.on { display: flex; }
  #soloPc p { margin: 0; font-size: clamp(40px, 11vw, 76px); font-weight: 700; text-align: center; letter-spacing: -0.5px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="needs"><img id="needAgua" src="assets/icon-agua.png" alt=""><img id="needDormir" src="assets/icon-dormir.png" alt=""></div>
  <div id="online">Conectando…</div>
</div>
<div id="race"><div id="raceCount"></div><div id="raceMsg"></div></div>

<div class="overlay" id="intro">
  <h1>Melipilla <span>simulator</span></h1>
  <div class="bar"><div id="loadBar"></div></div>
  <div id="loadText">Cargando el campo…</div>
  <div id="pick">
    <p>Elige quién vas a ser</p>
    <div class="row">
      <button type="button" data-role="cow">Vaca</button>
      <button type="button" data-role="horse">Caballo</button>
      <button type="button" data-role="pig">Cerdo</button>
      <button type="button" data-role="duck">Pato</button>
    </div>
  </div>
</div>

<div id="soloPc"><p>Solo para PC</p></div>
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var phone = /iPhone|iPod|Windows Phone|IEMobile|Opera Mini|BlackBerry/i.test(ua)
      || (/Android/i.test(ua) && /Mobile/i.test(ua))
      || !!(navigator.userAgentData && navigator.userAgentData.mobile);
    if (!phone) {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'main.js';
      document.body.appendChild(s);
      return;
    }
    document.getElementById('soloPc').classList.add('on');
    document.getElementById('intro').style.display = 'none';
  })();
</script>
</body>
</html>
